<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}学生 GitHub 日报追踪器{% endblock %}</title>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1558b0;
            --success: #34a853;
            --success-dark: #2d8f47;
            --danger: #d93025;
            --danger-dark: #b3261e;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #202124;
            --text-muted: #5f6368;
            --border: #e8eaed;
            --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
            --shadow-hover: 0 4px 12px rgba(0,0,0,0.15);
            --radius: 12px;
            --radius-sm: 8px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            font-size: 16px;
        }
        
        nav {
            background: linear-gradient(135deg, var(--primary) 0%, #1558b0 100%);
            color: white;
            padding: 0.75rem 2rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            box-shadow: 0 2px 8px rgba(26,115,232,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        nav a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            transition: all 0.15s ease;
        }
        
        nav a:hover {
            color: white;
            background: rgba(255,255,255,0.15);
            text-decoration: none;
        }
        
        nav .brand {
            font-weight: 700;
            font-size: 1.15rem;
            opacity: 1;
            border-bottom: 2px solid rgba(255,255,255,0.4);
            padding-bottom: 0.15rem;
            margin-right: 0.5rem;
        }
        
        main {
            max-width: 1280px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        
        h1 {
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        h1 small {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 400;
        }
        
        h2 {
            margin: 2rem 0 1rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
        }
        
        h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 1rem;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: box-shadow 0.2s ease;
        }
        
        .card:hover {
            box-shadow: var(--shadow-hover);
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.15s ease;
            gap: 0.4rem;
        }
        
        .btn:hover {
            transform: translateY(-1px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: var(--success-dark); }
        
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: var(--danger-dark); }
        
        .btn-small { padding: 0.3rem 0.75rem; font-size: 0.85rem; }
        
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }
        
        .project-card {
            position: relative;
        }
        
        .project-card h3 {
            margin-top: 0;
            font-size: 1.15rem;
        }
        
        .project-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        
        .project-link:hover {
            text-decoration: underline;
        }
        
        .status-line {
            margin: 0.5rem 0;
            font-size: 0.95rem;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }
        
        .progress-wrap {
            background: var(--border);
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
            margin: 0.75rem 0;
        }
        
        .progress-bar {
            background: linear-gradient(90deg, var(--success) 0%, #81c784 100%);
            height: 100%;
            border-radius: 20px;
            transition: width 0.3s ease;
        }
        
        .inline-form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: flex-end;
        }
        
        .inline-form > * {
            flex: 1;
            min-width: 150px;
        }
        
        .inline-form input[type="text"],
        .inline-form input[type="date"],
        .inline-form select {
            padding: 0.55rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            background: white;
            color: var(--text);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        
        .inline-form input:focus,
        .inline-form select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
        }
        
        .card-actions {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        
        .badge {
            font-size: 0.75rem;
            background: #e8f0fe;
            color: var(--primary);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-weight: 500;
        }
        
        .badge-done {
            background: #e6f4ea;
            color: var(--success);
        }
        
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .chip {
            background: #f1f3f4;
            border-radius: 16px;
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .comment-cell {
            max-width: 400px;
            white-space: pre-wrap;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 1rem;
        }
        
        th, td {
            padding: 0.875rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.925rem;
        }
        
        th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        tr:hover td {
            background: #f8fafc;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: inherit;
            background: white;
            color: var(--text);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
        }
        
        .empty {
            color: var(--text-muted);
            font-style: italic;
            padding: 2rem;
            text-align: center;
            background: #f8fafc;
            border-radius: var(--radius-sm);
            border: 2px dashed var(--border);
        }
        
        @media (max-width: 768px) {
            nav { padding: 0.75rem 1rem; gap: 0.75rem; flex-wrap: wrap; }
            main { padding: 1rem; }
            .project-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">GitHub 日报追踪器</a>
        <a href="/">看板</a>
        <a href="/students">学生</a>
        <a href="/plans">计划</a>
        <a href="/config">配置</a>
        <a href="/results">评测结果</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
