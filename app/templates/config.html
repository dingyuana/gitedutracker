{% extends "base.html" %}
{% block title %}评分配置 — 学生 GitHub 日报追踪器{% endblock %}
{% block content %}
<h1>评分配置</h1>
<div class="card">
    <h3>权重配置</h3>
    <form method="POST" action="/config">
        <div class="form-group">
            <label>w_volume（代码量权重）</label>
            <input type="number" step="0.001" name="w_volume" value="{{ config.w_volume }}">
        </div>
        <div class="form-group">
            <label>w_quality（质量权重）</label>
            <input type="number" step="0.001" name="w_quality" value="{{ config.w_quality }}">
        </div>
        <div class="form-group">
            <label>w_match（匹配权重）</label>
            <input type="number" step="0.001" name="w_match" value="{{ config.w_match }}">
        </div>
        <div class="form-group">
            <label>LOC 阈值</label>
            <input type="number" name="loc_threshold" value="{{ config.loc_threshold }}">
        </div>
        <div class="form-group">
            <label>提前奖励</label>
            <input type="number" step="0.1" name="schedule_bonus" value="{{ config.schedule_bonus }}">
        </div>
        <div class="form-group">
            <label>滞后惩罚</label>
            <input type="number" step="0.1" name="schedule_penalty" value="{{ config.schedule_penalty }}">
        </div>
        <button type="submit" class="btn btn-primary">保存配置</button>
    </form>
</div>

<div class="card">
    <h3>LLM 设置</h3>
    <p style="color:#5f6368;font-size:0.85rem;margin-top:0">
        此处配置优先于 .env 生效。API Key 留空表示保持不变；不填的项沿用当前值。
    </p>
    <form method="POST" action="/config/llm">
        <div class="form-group">
            <label>模型名称（如 doubao-seed-1-6 / gpt-4o-mini）</label>
            <input type="text" name="llm_model" value="{{ llm.llm_model }}" placeholder="模型 ID">
        </div>
        <div class="form-group">
            <label>接口地址 Base URL</label>
            <input type="text" name="llm_base_url" value="{{ llm.llm_base_url }}" placeholder="https://.../api/v3">
        </div>
        <div class="form-group">
            <label>API Key {% if llm.has_api_key %}<span class="badge badge-done">已设置</span>{% else %}<span style="color:#d93025;font-size:0.8rem">未设置</span>{% endif %}</label>
            <input type="password" name="llm_api_key" value="" placeholder="留空保持现有 Key 不变">
        </div>
        <div class="form-group">
            <label>上下文最大字符数</label>
            <input type="number" name="llm_context_max_chars" value="{{ llm.llm_context_max_chars }}">
        </div>
        <button type="submit" class="btn btn-primary">保存 LLM 设置</button>
    </form>
</div>

<div class="card">
    <h3>邮件发送设置（SMTP）</h3>
    <p style="color:#5f6368;font-size:0.85rem;margin-top:0">
        此处配置优先于 .env 生效。密码/授权码留空表示保持不变；不填的项沿用当前值。
    </p>
    <form method="POST" action="/config/smtp">
        <div class="form-group">
            <label>SMTP 服务器地址</label>
            <input type="text" name="smtp_host" value="{{ smtp.smtp_host }}" placeholder="smtp.qq.com">
        </div>
        <div class="form-group">
            <label>SMTP 端口</label>
            <input type="number" name="smtp_port" value="{{ smtp.smtp_port }}" placeholder="587">
        </div>
        <div class="form-group">
            <label>发件邮箱</label>
            <input type="text" name="smtp_user" value="{{ smtp.smtp_user }}" placeholder="your@example.com">
        </div>
        <div class="form-group">
            <label>邮箱授权码/密码 {% if smtp.has_password %}<span class="badge badge-done">已设置</span>{% else %}<span style="color:#d93025;font-size:0.8rem">未设置</span>{% endif %}</label>
            <input type="password" name="smtp_pass" value="" placeholder="留空保持现有授权码不变">
        </div>
        <div class="form-group">
            <label>发件人显示名/邮箱</label>
            <input type="text" name="smtp_from" value="{{ smtp.smtp_from }}" placeholder="your@example.com">
        </div>
        <button type="submit" class="btn btn-primary">保存邮件设置</button>
    </form>
</div>
{% endblock %}
